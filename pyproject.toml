[project]
name = "stampan"
version = "0.1.0"
description = "Calibrated measurement of postage stamps from flatbed scans: perforation gauge, cancellation segmentation, and CIELAB/ISCC-NBS colour."
authors = [
    { name = "Rene Becker", email = "accounts@limhes.net" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "colour-science>=0.4.4",
    "tifffile>=2024.8.30",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "typer>=0.12",
]

[project.optional-dependencies]
gui = [
    "pyside6>=6.7",
    "pyqtgraph>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
stampan = "stampan.cli:app"
stampan-gui = "stampan.gui.app:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reference_data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
